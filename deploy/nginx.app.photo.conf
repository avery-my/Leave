# 合入 storage.base_url 对应的 App 站点 server 块。
location ^~ /api/v1/uploads/photo/ {
    if ($uri !~ "^/api/v1/uploads/photo/[a-f0-9]{32}\.jpg$") {
        return 404;
    }
    alias /www/wwwroot/Leave/uploads/photo/;
    autoindex off;
    access_log off;
    log_not_found off;
    add_header Cache-Control "private, no-store" always;
}
